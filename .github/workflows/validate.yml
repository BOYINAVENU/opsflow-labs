name: Validate lead workflow
on:
  push:
    paths:
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'tests/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/lead-validation.test.cjs
